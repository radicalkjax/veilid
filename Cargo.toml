[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
must_use_candidate = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "deny"
unused_async = "deny"
ptr_cast_constness = "deny"
comparison_chain = "allow"
upper_case_acronyms = "allow"
needless_range_loop = "allow"
mutable_key_type = "allow" # Until this is merged (NodeRef is safe to hash/eq): https://github.com/rust-lang/rust-clippy/pull/15844

[workspace.lints.rust]
unused_must_use = "deny"
# A type reachable through the public API but not nameable by a user is unusable there
unnameable_types = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
