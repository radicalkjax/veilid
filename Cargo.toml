[workspace]
members = [
    "veilid-tools",
    "veilid-core",
    "veilid-core/examples/basic",
    "veilid-core/examples/private_route",
    "veilid-server",
    "veilid-cli",
    "veilid-flutter/rust",
    "veilid-wasm",
    "veilid-remote-api",
]
resolver = "2"

[workspace.package]
repository = "https://gitlab.com/veilid/veilid"
authors = ["Veilid Team <contact@veilid.com>"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.89.0"

[patch.crates-io]

# For local development
# keyring-manager = { path = "../keyring-manager" }
# keyvaluedb = { path = "../keyvaluedb/keyvaluedb" }
# keyvaluedb-memorydb = { path = "../keyvaluedb/keyvaluedb-memorydb" }
# keyvaluedb-sqlite = { path = "../keyvaluedb/keyvaluedb-sqlite" }
# keyvaluedb-web = { path = "../keyvaluedb/keyvaluedb-web" }

# Size-optimized overall; crypto packages below stay at full opt for throughput
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.x25519-dalek]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.cipher]
opt-level = 3
[profile.release.package.digest]
opt-level = 3
[profile.release.package.crypto-common]
opt-level = 3
[profile.release.package.generic-array]
opt-level = 3
[profile.release.package.hpke]
opt-level = 3
[profile.release.package.hkdf]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3

[profile.dev.package.backtrace]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3
overflow-checks = false
debug-assertions = false

[profile.dev.package.ed25519-dalek]
opt-level = 3
overflow-checks = false
debug-assertions = false

[profile.dev.package.x25519-dalek]
opt-level = 3
overflow-checks = false
debug-assertions = false

[profile.dev.package.curve25519-dalek]
opt-level = 3
overflow-checks = false
debug-assertions = false

