[workspace]
members = [
    "veilid-tools",
    "veilid-core-optimized",
    "veilid-core",
    "veilid-core/examples/basic",
    "veilid-core/examples/private_route",
    "veilid-server",
    "veilid-cli",
    "veilid-flutter/rust",
    "veilid-wasm",
    "veilid-remote-api",
]
resolver = "2"

[workspace.package]
repository = "https://gitlab.com/veilid/veilid"
authors = ["Veilid Team <contact@veilid.com>"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.89.0"

# [patch.crates-io]
# For local development
# keyring-manager = { path = "../keyring-manager" }
# keyvaluedb = { path = "../keyvaluedb/keyvaluedb" }
# keyvaluedb-memorydb = { path = "../keyvaluedb/keyvaluedb-memorydb" }
# keyvaluedb-sqlite = { path = "../keyvaluedb/keyvaluedb-sqlite" }
# keyvaluedb-web = { path = "../keyvaluedb/keyvaluedb-web" }

# Speed by default: every native binary (veilid-server, veilid-flutter) ships this.
[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

# The wasm targets build with `--profile size`: what a browser downloads. Crypto and the
# hot path stay at full opt. A package override reaches only that package's own code:
# generic and #[inline] code is compiled where it is instantiated, which is why
# veilid-core-optimized exists and is listed too.
[profile.size]
inherits = "release"
opt-level = "z"

[profile.size.package.veilid-core-optimized]
opt-level = 3
[profile.size.package.curve25519-dalek]
opt-level = 3
[profile.size.package.ed25519-dalek]
opt-level = 3
[profile.size.package.x25519-dalek]
opt-level = 3
[profile.size.package.chacha20poly1305]
opt-level = 3
[profile.size.package.chacha20]
opt-level = 3
[profile.size.package.poly1305]
opt-level = 3
[profile.size.package.blake3]
opt-level = 3
[profile.size.package.blake2]
opt-level = 3
[profile.size.package.sha2]
opt-level = 3
[profile.size.package.argon2]
opt-level = 3
[profile.size.package.cipher]
opt-level = 3
[profile.size.package.digest]
opt-level = 3
[profile.size.package.crypto-common]
opt-level = 3
[profile.size.package.generic-array]
opt-level = 3
[profile.size.package.hpke]
opt-level = 3
[profile.size.package.hkdf]
opt-level = 3
[profile.size.package.hmac]
opt-level = 3

[profile.dev.package.veilid-core-optimized]
opt-level = 3
overflow-checks = false
debug-assertions = false

