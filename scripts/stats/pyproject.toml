[project]
name = "veilid-stats"
version = "0.1.0"
description = "Signal-focused reporter for veilid stats NDJSON dumps"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
veilid-stats = "veilid_stats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veilid_stats"]
