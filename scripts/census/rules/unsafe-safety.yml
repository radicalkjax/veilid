id: unsafe-safety
language: rust
severity: error
message: "unsafe block has no // SAFETY: comment"
note: |
  Every unsafe block states why it is sound, on the line above it:

      // SAFETY: fd is owned by this struct and outlives the call
      unsafe { libc::close(fd) };

  The comment may run to several lines; only the first has to start with SAFETY:.
  A comment serves exactly the one block below it, so two adjacent unsafe blocks
  need two comments.

  Blind spot: a macro body (cfg_if!, among others) is one token tree to the parser,
  so an unsafe block inside it is never seen by this rule or counted by the sites
  rule. Hoist the block into a #[cfg]-gated fn beside its caller. A block inside a
  macro_rules! definition cannot move (its expansions are the sites); it keeps a
  hand-written SAFETY line.
files:
  - "veilid-core-optimized/src/**"
  - "veilid-core/src/**"
  - "veilid-tools/src/**"
  - "veilid-flutter/rust/src/**"

utils:
  safety-comment:
    kind: line_comment
    regex: '^//\s*SAFETY:'
  is-comment:
    any:
      - kind: line_comment
      - kind: block_comment
  # Walks back through a run of comments rather than stopping at the first
  # neighbour, so a multi-line safety argument still counts. This is what makes
  # the rule survive a cargo fmt rewrap.
  declared:
    follows:
      matches: safety-comment
      stopBy:
        not:
          matches: is-comment
  in-test-module:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
        stopBy: end

rule:
  kind: unsafe_block
  not:
    any:
      # The comment sits directly above the block
      - matches: declared
      # ...or above the statement holding it, which is the usual shape: an unsafe block is
      # wrapped in an expression_statement or a let_declaration, so the comment is the
      # STATEMENT's sibling, not the block's. Bounded at the enclosing block so a comment
      # covers its own statement however deeply the block is nested inside it, and cannot
      # reach up to serve a whole function.
      - inside:
          stopBy:
            kind: block
          matches: declared
      - matches: in-test-module
