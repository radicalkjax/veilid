id: unsafe-safety-sites
language: rust
severity: hint
message: "unsafe block (census population, not a violation)"
note: |
  Counts every unsafe block the unsafe-safety rule considers, declared or not.
  Its only job is the empty-sweep backstop: if the matcher silently stops working
  this count collapses to zero and the census diff catches it. A rule that matches
  nothing passes forever otherwise.
files:
  - "veilid-core-optimized/src/**"
  - "veilid-core/src/**"
  - "veilid-tools/src/**"
  - "veilid-flutter/rust/src/**"
utils:
  in-test-module:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
        stopBy: end
rule:
  kind: unsafe_block
  not:
    matches: in-test-module
