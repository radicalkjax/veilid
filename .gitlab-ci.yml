# veilid-flutter end to end against the in-process mock, headless on flutter-tester.
# Installs the versions.env-pinned Flutter SDK in the image (+deps-flutter).
test_flutter_integration:
  extends: .unit_test
  variables:
    earthly_target: test-flutter-integration

semgrep:
  # A Docker image with Semgrep installed.
  # Small: 157s and nowhere near the critical path (test_unit_tests_all is 901s), so extra cores
  # would buy pipeline time nothing.
  extends: .runner_small
  image: semgrep/semgrep

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH

  variables:
    # The one job that genuinely needs git history: `semgrep ci` is diff-aware and resolves a
    # baseline ref to scan only what changed. Under the pipeline-wide GIT_DEPTH: 1 it cannot find
    # one, and `|| true` below would hide it scanning nothing -- a quiet coverage hole in a
    # security gate rather than a failure. 0 means a full clone.
    GIT_DEPTH: 0

    # Connect to Semgrep AppSec Platform through your SEMGREP_APP_TOKEN.
    # Generate a token from Semgrep AppSec Platform > Settings
    # and add it as a variable in your GitLab CI/CD project settings.
    SEMGREP_APP_TOKEN: $SEMGREP_APP_TOKEN

    # Upload findings to GitLab SAST Dashboard:
    SEMGREP_GITLAB_JSON: "1"

  # Other optional settings in the `variables` block:

  # Receive inline MR comments (requires Semgrep AppSec Platform account)
  # Setup instructions:
  # https://semgrep.dev/docs/semgrep-appsec-platform/gitlab-mr-comments
  #   GITLAB_TOKEN: $PAT

  # Run the "semgrep ci" command on the command line of the docker image and send findings
  # to GitLab SAST.
  script: semgrep ci --gitlab-sast > gl-sast-report.json || true
  allow_failure: true
  artifacts:
    reports:
      sast: gl-sast-report.json

# The prebuilt veilid-flutter library for Windows x64, which a Windows app build bundles through the
# hook's prebuilt tier instead of compiling it (veilid-flutter/hook/prebuilt.dart). Cross-built
# with clang-cl and lld-link (+deps-xwin) against the MSVC CRT and Windows SDK, which xwin fetches
# under Microsoft's license (https://go.microsoft.com/fwlink/?LinkId=2086102), accepted by the
# Veilid Foundation.
# Published per commit with the job token, keeping the newest seven untagged versions
# (scripts/ci/publish_prebuilt.sh); the prune needs the token's ADMIN_PACKAGES permission.
prebuilt_flutter_windows_x64:
  extends: .base_large
  stage: build_packages
  needs:
    - job: build_images
      optional: true
  script:
    - !reference [.earthly_setup, script]
    - earthly --use-inline-cache +prebuilt-flutter-windows-x64 --TOOLS=container --TOOLS_IMAGE=$CI_REGISTRY_IMAGE $project_args --COMMIT=$CI_COMMIT_SHA --BUILD_HOST="$CI_RUNNER_DESCRIPTION"
    - apk add curl jq
    - sh scripts/ci/publish_prebuilt.sh target/prebuilt/flutter-windows-x64
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'

# Actual release -- triggered by pushing a new version tag

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "running release_job"
  release: # See https://docs.gitlab.com/ee/ci/yaml/#release for available properties
    tag_name: "$CI_COMMIT_TAG"
    description: "$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'

create_build_machine:
  stage: prepare
  tags:
    - build-orchestration
  script:
    - uv --directory scripts/cicd-python sync
    - uv --directory scripts/cicd-python run veilid_release_utils.py --create-build-machine
  artifacts:
    paths:
      - scripts/cicd-python/config.json
    expire_in: 6 hours
  rules:
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'

package_linux:
  stage: build_packages
  timeout: 120m
  tags:
    - build-amd64-deb
  script:
    - earthly bootstrap
    - earthly +package-linux
  artifacts:
    paths:
      - target/packages/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'

build_repositories:
  stage: distribute
  tags:
    - build-orchestration
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - cp scripts/cicd/build-orchestration/rpm-repo-building/Dockerfile ~/rpm-build-container
    - cp scripts/cicd/build-orchestration/rpm-repo-building/repobuild.sh ~/rpm-build-container
    - cp scripts/cicd/build-orchestration/generate-stable-release.sh ~
    - bash scripts/cicd/build-orchestration/distribute-stable-packages.sh
  dependencies:
    - package_linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'

publish_crates:
  stage: distribute
  needs:
    - build_repositories
  tags:
    - build-amd64-deb
  script:
    - cargo publish -p veilid-tools --dry-run
    - cargo publish -p veilid-tools
    - cargo publish -p veilid-core-optimized --dry-run
    - cargo publish -p veilid-core-optimized
    - cargo publish -p veilid-core --dry-run
    - cargo publish -p veilid-core
    - cargo publish -p veilid-remote-api --dry-run
    - cargo publish -p veilid-remote-api
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'

publish_python:
  stage: distribute
  needs:
    - build_repositories
  tags:
    - build-amd64-deb
  script:
    - uv --directory veilid-python build
    - uv --directory veilid-python publish
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'

delete_build_machines:
  stage: cleanup
  tags:
    - build-orchestration
  dependencies:
    - create_build_machine
  script:
    - uv --directory scripts/cicd-python sync
    - uv --directory scripts/cicd-python run veilid_release_utils.py --delete-build-machine
  rules:
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'

# Dryrun release -- triggered by changes in .gitlab-ci.yml, CICD scripts, or Earthfile

dryrun_create_build_machine:
  stage: prepare
  tags:
    - build-orchestration
  script:
    - uv --directory scripts/cicd-python sync
    - uv --directory scripts/cicd-python run veilid_release_utils.py --create-build-machine
  artifacts:
    paths:
      - scripts/cicd-python/config.json
    expire_in: 6 hours
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[ci dryrun]/

dryrun_package_linux:
  stage: build_packages
  tags:
    - build-amd64-deb
  script:
    - earthly bootstrap
    - earthly +package-linux
  artifacts:
    paths:
      - target/packages/*
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[ci dryrun]/

dryrun_publish_crates:
  stage: build_packages
  needs:
    - dryrun_package_linux
  tags:
    - build-amd64-deb
  script:
    - vlt login
    - vlt run --command="cargo publish -p veilid-tools --dry-run"
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[ci dryrun]/

dryrun_publish_python:
  stage: build_packages
  needs:
    - dryrun_package_linux
  tags:
    - build-amd64-deb
  script:
    - uv --directory veilid-python build
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[ci dryrun]/

dryrun_build_repositories:
  stage: distribute
  tags:
    - build-orchestration
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - cp scripts/cicd/build-orchestration/rpm-repo-building/Dockerfile ~/rpm-build-container
    - cp scripts/cicd/build-orchestration/rpm-repo-building/repobuild.sh ~/rpm-build-container
    - cp scripts/cicd/build-orchestration/generate-stable-release.sh ~
    - bash scripts/cicd/build-orchestration/distribute-stable-packages.sh
  dependencies:
    - dryrun_package_linux
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[ci dryrun]/

dryrun_deploy_repos:
  stage: distribute
  needs:
    - dryrun_build_repositories
  tags:
    - repo-server
  script:
    - ls -al $HOME/repo.tar
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[ci dryrun]/

dryrun_delete_build_machines:
  stage: cleanup
  tags:
    - build-orchestration
  dependencies:
    - dryrun_create_build_machine
  script:
    - uv --directory scripts/cicd-python sync
    - uv --directory scripts/cicd-python run veilid_release_utils.py --delete-build-machine
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[ci dryrun]/

# Nightly build pipeline

nightly_create_build_machines:
  stage: prepare
  tags:
    - build-orchestration
  script:
    - uv --directory scripts/cicd-python sync
    - uv --directory scripts/cicd-python run veilid_release_utils.py --create-build-machine
  artifacts:
    paths:
      - scripts/cicd-python/config.json
    expire_in: 6 hours
  rules:
    - if: $IS_NIGHTLY == "true"

nightly_package_linux:
  stage: build_packages
  tags:
    - build-amd64-deb
  timeout: 120m
  script:
    - earthly bootstrap
    - earthly +package-linux --IS_NIGHTLY="$IS_NIGHTLY"
  artifacts:
    paths:
      - target/packages/*
  rules:
    - if: $IS_NIGHTLY == "true"

nightly_build_repositories:
  stage: distribute
  tags:
    - build-orchestration
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./"
  script:
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - cp scripts/cicd/build-orchestration/rpm-repo-building/Dockerfile ~/rpm-build-container
    - cp scripts/cicd/build-orchestration/rpm-repo-building/repobuild.sh ~/rpm-build-container
    - cp scripts/cicd/build-orchestration/generate-nightly-release.sh ~
    - bash scripts/cicd/build-orchestration/distribute-nightly-packages.sh
  dependencies:
    - nightly_package_linux
  rules:
    - if: $IS_NIGHTLY == "true"

nightly_delete_build_machines:
  stage: cleanup
  tags:
    - build-orchestration
  dependencies:
    - nightly_create_build_machines
  script:
    - uv --directory scripts/cicd-python sync
    - uv --directory scripts/cicd-python run veilid_release_utils.py --delete-build-machine
  rules:
    - if: $IS_NIGHTLY == "true"

# If any steps fail this will run the build machine tear down scripts. Each is gated to the
# pipeline that creates its build machine; a failed test pipeline has nothing to tear down.

stable_failed_pipeline_actions:
  stage: failed
  tags:
    - build-orchestration
  dependencies:
    - create_build_machine
  script:
    - uv --directory scripts/cicd-python sync
    - uv --directory scripts/cicd-python run veilid_release_utils.py --delete-build-machine
  rules:
    - if: '$CI_COMMIT_TAG =~ /v\d.+/'
      when: on_failure

nightly_failed_pipeline_actions:
  stage: failed
  tags:
    - build-orchestration
  dependencies:
    - nightly_create_build_machines
  script:
    - uv --directory scripts/cicd-python sync
    - uv --directory scripts/cicd-python run veilid_release_utils.py --delete-build-machine
  rules:
    - if: $IS_NIGHTLY == "true"
      when: on_failure
