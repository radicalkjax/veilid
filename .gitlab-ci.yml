include:
  - local: .gitlab/ci/common.yml

###########################################################################
# Stages

stages:
  - tools
  - prepare
  - test
  - build_packages
  - distribute
  - release
  - cleanup
  - failed

###########################################################################
# Common YAML fragments

# Rules for running tests
# Runs on merge requests and events that cause update to merge requests (like pushing to a branch with an open merge request)
# Only runs if the crates, the Cargo files, or the build itself (CI config, Earthfile, scripts,
# pinned tool versions) changed. A push to the default branch runs the same gate. A manual run
# of a branch (Run pipeline in the web UI) has no diff base, so everything runs. Tags are
# excluded: a tag pipeline is a release.
.branch_test_rules: &branch_test_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
    changes:
      - veilid-*/**/*
      - "**/*[Cc]argo*"
      - .gitlab-ci.yml
      - .gitlab/**/*
      - Earthfile
      - .earthlyignore
      - .dagger/**/*
      - dev-setup/**/*
      - scripts/**/*
      - clippy.toml
      - sgconfig.yml
    when: on_success
  - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH
    when: on_success
  # Do not run any other pipeline types
  - when: never

# Rules for running formatting checks
.branch_format_rules: &branch_format_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
    changes:
      - veilid-*/**/*.rs # Should fire when rust source files are changed
      - "**/*[Cc]argo*"
      - scripts/_check_format_rust.sh
      - .gitlab-ci.yml
      - .gitlab/**/*
    when: on_success
  - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH
    when: on_success
  # Do not run any other pipeline types
  - when: never

# Rules for the Python gates (black, mypy): the sources wherever they live, the project files
# and the scripts that run them
.branch_python_rules: &branch_python_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
    changes:
      - "**/*.py"
      - veilid-python/**/*
      - scripts/**/*
      - .gitlab-ci.yml
      - .gitlab/**/*
    when: on_success
  - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH
    when: on_success
  # Do not run any other pipeline types
  - when: never

# Rules for the TypeScript format gate (prettier)
.branch_typescript_rules: &branch_typescript_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
    changes:
      - veilid-wasm/**/*
      - scripts/**/*
      - .gitlab-ci.yml
      - .gitlab/**/*
    when: on_success
  - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH
    when: on_success
  # Do not run any other pipeline types
  - when: never

# Common unit test base
.unit_test:
  # Large by default: most users of this template are compile-bound. The three that are not
  # (census, readme-sync, dart-format do no rust compilation) drop back to medium individually.
  extends: .base_large
  variables:
    earthly_target: test-all
  stage: test
  # A superseded pipeline should hand its runners back rather than finish a lint nobody reads.
  interruptible: true
  # Stage order alone would make every test wait for the whole prepare stage. These are the only
  # real dependencies: the tool images, and the crate cache when this lockfile has one.
  needs:
    - job: build_images
      optional: true
  before_script:
    - !reference [.earthly_setup, script]
    # Degrade to downloading crates rather than failing on a missing image. The child pipeline's
    # crate_cache job should have published this tag, so a miss here means that job was skipped
    # or failed -- worth a slower build, not a failed one.
    - |
      CRATE_CACHE_TAG=$(sh scripts/cache_tags.sh crate)
      if docker manifest inspect "$CI_REGISTRY_IMAGE/crate-cache:$CRATE_CACHE_TAG" > /dev/null 2>&1; then
        crate_cache_args="--CRATE_CACHE_TAG=$CRATE_CACHE_TAG"
        echo "Using crate cache: crate-cache:$CRATE_CACHE_TAG"
      else
        crate_cache_args=""
        echo "No crate-cache:$CRATE_CACHE_TAG published; crates download during the build"
      fi
  script:
    - earthly --use-inline-cache +$earthly_target --TOOLS=container --TOOLS_IMAGE=$CI_REGISTRY_IMAGE $project_args $crate_cache_args
  rules:
    - *branch_test_rules

###########################################################################
# Jobs

format_rust:
  extends: .runner_small
  stage: test
  # Pinned to RUST_VERSION: unpinned `rust:slim` tracks stable (1.98.1 at the time of writing)
  # while everything else builds with 1.92.0, and rustfmt's output does change between releases --
  # so the gate could disagree with the local check_all.sh run, which pins the same version.
  # check_all.sh fails if this literal drifts from .dagger/versions.env.
  # DELIBERATE EXCEPTION to "test jobs do not install software": no image avoids it. Every
  # upstream rust image uses --profile minimal (checked: 1.92.0 and 1.92.0-slim both lack rustfmt)
  # and our own tool-rust installs `-c clippy` only. Using tool-rust here would pull 1757MB rather
  # than 318MB to skip a ~5MB component on a job that finishes in under a minute.
  image: rust:1.92.0-slim
  before_script:
    - rustup component add rustfmt

  script:
    - ./scripts/_check_format_rust.sh

  rules:
    - *branch_format_rules

# The Python and TypeScript halves of the format gate, and mypy. Source-only, so each runs on the
# smallest upstream image with its interpreter, pinned by tag like the format_rust job; the tools
# themselves come from veilid-python/uv.lock and veilid-wasm/tests/package-lock.json. eslint reads
# types generated from the wasm crate, so it is an earthly job below (test_lint_typescript).
format_python:
  extends: .runner_small
  stage: test
  image: astral/uv:0.13.1-python3.12-trixie-slim
  script:
    - ./scripts/_check_format_python.sh
  rules:
    - *branch_python_rules

lint_python:
  extends: .runner_small
  stage: test
  image: astral/uv:0.13.1-python3.12-trixie-slim
  script:
    - ./scripts/_lint_python.sh
  rules:
    - *branch_python_rules

format_typescript:
  extends: .runner_small
  stage: test
  image: node:22.23.3-slim
  script:
    - (cd veilid-wasm/tests && npm ci --no-audit --no-fund)
    - ./scripts/_check_format_typescript.sh
  rules:
    - *branch_typescript_rules

# Which build images are missing, decided in a curl-only container: no docker, no docker-in-docker
# service, no earthly. The registry v2 API answers 200/404 for a tag given only a JWT, so this is
# the disqualifier — on a warm pipeline it is the single cheap job that runs before the tests,
# instead of a chain of earthly jobs each costing ~110s of startup to discover there is nothing
# to do.
plan_images:
  extends: .runner_small
  stage: tools
  # curl ships in the image and busybox supplies the sh/sed/sha256sum the scripts need, so this
  # job installs nothing at run time. entrypoint cleared: the image's own is curl.
  image:
    name: alpine/curl:latest
    entrypoint: [""]
  interruptible: true
  script:
    - sh scripts/ci/plan_images.sh images.env
  artifacts:
    reports:
      dotenv: images.env
  rules:
    - *branch_test_rules

# Build only what plan_images found missing, in dependency waves (see .gitlab/ci/images.yml).
# A trigger job runs on no runner at all, so a fully cached pipeline pays nothing here beyond the
# child's own no-op job.
build_images:
  stage: tools
  needs: [plan_images]
  trigger:
    include:
      - local: .gitlab/ci/images.yml
    strategy: depend
  variables:
    BUILD_DEPS_BASE: $BUILD_DEPS_BASE
    BUILD_TOOL_FLUTTER: $BUILD_TOOL_FLUTTER
    BUILD_TOOL_RUST: $BUILD_TOOL_RUST
    BUILD_TOOL_ZIG: $BUILD_TOOL_ZIG
    BUILD_TOOL_BINARYEN: $BUILD_TOOL_BINARYEN
    BUILD_TOOL_CARGO_BINS: $BUILD_TOOL_CARGO_BINS
    BUILD_TOOL_ASTGREP: $BUILD_TOOL_ASTGREP
    BUILD_TOOL_ZIGBUILD: $BUILD_TOOL_ZIGBUILD
    BUILD_DEPS_LINUX: $BUILD_DEPS_LINUX
    BUILD_DEPS_FLUTTER: $BUILD_DEPS_FLUTTER
    BUILD_DEPS_FLUTTER_RUST: $BUILD_DEPS_FLUTTER_RUST
    BUILD_DEPS_XWIN: $BUILD_DEPS_XWIN
    BUILD_CRATE_CACHE: $BUILD_CRATE_CACHE
  rules:
    - *branch_test_rules

# Keep the 3 most recent tags in each tool-* repository and in crate-cache. The project-wide
# cleanup policy cannot express this: it matches tag names across every repository and its keep_n
# is a fixed set of values with no 3 in it. The bulk tag delete API takes an arbitrary keep_n one
# repository at a time, so this walks them individually. crate-cache accumulates one tag per
# distinct Cargo.lock and would otherwise grow without limit. The tag the build currently asks
# for is kept whatever its age, so a revert to an older lockfile or pinned version still finds
# its image.
#
# Needs REGISTRY_CLEANUP_TOKEN (CI/CD variable): a project access token with api scope and at
# least the Maintainer role. CI_JOB_TOKEN cannot delete registry tags. Without it this no-ops.
registry_cleanup:
  # curl and jq only; no earthly, no dind.
  extends: .runner_small
  image: alpine:latest
  stage: cleanup
  script:
    - apk update && apk add curl jq
    - |
      if [ -z "${REGISTRY_CLEANUP_TOKEN:-}" ]; then
        echo "REGISTRY_CLEANUP_TOKEN is not set; skipping registry cleanup."
        exit 0
      fi
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories"
      curl -sSf --header "PRIVATE-TOKEN: $REGISTRY_CLEANUP_TOKEN" "$api?per_page=100" \
        | jq -r '.[] | select((.name | startswith("tool-")) or .name == "crate-cache" or .name == "deps-linux" or .name == "deps-flutter" or .name == "deps-flutter-rust" or .name == "deps-xwin" or .name == "earthly-buildkitd") | "\(.id) \(.name)"' > /tmp/cache_repos.txt
      if [ ! -s /tmp/cache_repos.txt ]; then
        echo "no tool-*, deps-linux or crate-cache repositories in the registry; nothing to clean."
        exit 0
      fi
      while read -r id name; do
        # The tag this build asks for, kept whatever its age; dots escaped for the re2 regex
        case "$name" in
          crate-cache) keep=$(sh scripts/cache_tags.sh crate) ;;
          deps-linux)  keep=$(sh scripts/tool_tags.sh deps-linux) ;;
          deps-flutter) keep=$(sh scripts/tool_tags.sh deps-flutter) ;;
          deps-flutter-rust) keep=$(sh scripts/tool_tags.sh deps-flutter-rust) ;;
          deps-xwin)   keep=$(sh scripts/tool_tags.sh deps-xwin) ;;
          earthly-buildkitd) keep="v$(. .dagger/versions.env && echo $EARTHLY_VERSION)-.*" ;;
          *)           keep=$(sh scripts/tool_tags.sh "${name#tool-}") ;;
        esac
        keep=$(printf '%s' "$keep" | sed 's/[.]/\\./g')
        have=$(curl -sSf --header "PRIVATE-TOKEN: $REGISTRY_CLEANUP_TOKEN" "$api/$id/tags?per_page=100" | jq 'length')
        echo "$name: $have tags, keeping 3 most recent plus ^$keep\$"
        q="name_regex_delete=$(jq -rn '".*" | @uri')&keep_n=3&name_regex_keep=$(jq -rn --arg v "^$keep\$" '$v | @uri')"
        curl -sS --fail-with-body --request DELETE \
          --header "PRIVATE-TOKEN: $REGISTRY_CLEANUP_TOKEN" "$api/$id/tags?$q" || exit 1
        echo
      done < /tmp/cache_repos.txt
  rules:
    # Maintenance, not part of a code pipeline: the scheduled run, or by hand from the web UI.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never

