include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
    one_member_abstracts: ignore
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    unawaited_futures: true
    avoid_positional_boolean_parameters: false
    public_member_api_docs: true
