# native_toolchain_rust rejects the stable/beta/nightly channels and requires the build
# target listed here. Channel tracks RUST_VERSION in .dagger/versions.env.
[toolchain]
channel = "1.92.0"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
