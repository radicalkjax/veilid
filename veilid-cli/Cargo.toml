[package]
# --- Bumpversion match - do not reorder
name = "veilid-cli"
version = "0.5.7"
# ---
description = "Client application for connecting to a Veilid headless node"
resolver = "2"
repository.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "veilid-cli"
path = "src/main.rs"

[features]
default = ["rt-tokio"]
default-async-std = ["rt-async-std"]

rt-async-std = [
    "async-std",
    "veilid-tools/rt-async-std",
]
rt-tokio = ["tokio", "tokio-util", "veilid-tools/rt-tokio"]
debug-locks = ["veilid-tools/debug-locks"]

[dependencies]
async-std = { version = "1.13.0", features = [
    "unstable",
    "attributes",
], optional = true }
tokio = { version = "1.43.0", features = [
    "sync",
    "macros",
    "io-std",
    "io-util",
    "fs",
], optional = true }
tokio-util = { version = "0.7.13", features = ["compat"], optional = true }
cursive = { version = "0.21", default-features = false, features = [
    "crossterm-backend",
    "toml",
    "ansi",
] }

# cursive-multiplex = "0.6.0"
# cursive_tree_view = "0.6.0"
cursive_table_view = "0.15"
arboard = { version = "3.4.1", default-features = false }
# cursive-tabs = "0.5.0"
clap = { version = "4", features = ["derive"] }
directories = "^6.0.0"
log = "0.4.33"
futures-util = { version = "0.3.32", default-features = false, features = [
    "alloc",
    "io",
] }
serde = "1.0.228"
serde_derive = "1.0.228"
parking_lot = "0.12.5"
cfg-if = "1.0.4"
config = { version = "0.15.25", default-features = false, features = ["yaml"] }
flexi_logger = { version = "0.31.9" }
thiserror = "2.0.18"
crossbeam-channel = "0.5.15"
hex = "0.4.3"
veilid-tools = { version = "0.5.7", path = "../veilid-tools", default-features = false }

json = { package = "jzon", version = "0.12.5" }
flume = { version = "0.12.0", features = ["async"] }
data-encoding = { version = "2.11.0" }
indent = { version = "0.1.1" }

chrono = "0.4.40"
unicode-width = "0.2.2"
rustyline-async = "0.4.5"
console = "0.16.4"

[lints]
workspace = true
